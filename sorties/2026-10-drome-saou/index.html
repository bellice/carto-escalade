<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sortie escalade - Drôme, forêt de Saoû</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23a8452f'/></svg>" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="../../assets/style.css" />
</head>
<body>

  <header class="map-header">
    <a href="../../index.html">← Sorties</a>
    <span class="titre">Drôme - forêt de Saoû</span>
  </header>

  <div class="recherche">
    <div class="recherche-champ">
      <input type="search" list="falaises-liste" placeholder="Chercher une falaise…" aria-label="Rechercher une falaise" />
      <button type="button" class="btn-effacer" aria-label="Effacer la recherche" hidden>×</button>
    </div>
    <datalist id="falaises-liste"></datalist>
    <button type="button" class="btn-centrer" aria-label="Centrer la carte sur le résultat">Centrer</button>
  </div>

  <div id="map"></div>

  <div id="etat-chargement" class="etat-chargement">Chargement de la carte…</div>

  <div class="legende">
    <div class="legende-contenu" id="legende-contenu">
      <div class="legende-cats">
        <span id="cle-falaises-zone"><span class="cle"><span class="dot"></span> Falaises</span></span>
        <span class="cle"><span class="dot parking"></span> Parkings <span class="note">(via une falaise)</span></span>
        <span class="cle" id="legende-gite"><span class="dot gite"></span> Gîte</span>
      </div>
      <div class="legende-falaises" id="legende-falaises"></div>
      <div class="legende-figure">
        <select id="mode-figure" aria-label="Grandeur utilisée pour la taille des cercles">
          <option value="aucun">Voies</option>
          <option value="faciles">Voies 5-6a+</option>
          <option value="couenne" id="option-couenne">Couenne</option>
          <option value="gv" id="option-gv">Grande voie</option>
          <option value="type" id="option-type">Type de voie</option>
        </select>
      </div>
    </div>
    <button type="button" class="legende-toggle" aria-expanded="true" aria-controls="legende-contenu">Masquer</button>
  </div>

  <!-- assets/js/carte.js et ses propres imports (maplibre-gl, puis les
       modules internes qu'il importe) s'exécutent dans l'ordre du document,
       avant DOMContentLoaded — donc initCarte est déjà résolu au moment où
       ce code s'exécute. -->
  <script type="module">
    import { initCarte } from '../../assets/js/carte.js';
    document.addEventListener('DOMContentLoaded', () => {
      initCarte('data.geojson');
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js', { scope: '../../' });
    }
  </script>
</body>
</html>
