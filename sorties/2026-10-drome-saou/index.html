<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sortie escalade - Drôme, forêt de Saoû</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23a8452f'/></svg>" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" />

  <!-- Le graphe d'imports ES (carte.js -> marqueurs.js -> popups.js/symboles.js...)
       ne se découvre normalement qu'au fil du parsing de chaque module reçu,
       en 2-3 aller-retours séquentiels avant qu'initCarte() ne puisse
       tourner (mesuré : peut ajouter plusieurs centaines de ms sur un signal
       faible, exactement le contexte d'usage visé). Ces indices demandent au
       navigateur de tout récupérer en parallèle dès le départ. crossorigin
       requis pour maplibre-gl.mjs (autre origine) — sans lui, le navigateur
       le télécharge une seconde fois au moment de l'import réel. Les fichiers
       maplibre sont PRÉ-CACHÉS par le service worker (voir sw.js) : l'offline
       reste garanti malgré le CDN. -->
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.4.1/dist/maplibre-gl.mjs" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.4.1/dist/maplibre-gl-shared.mjs" crossorigin />
  <link rel="modulepreload" href="../../assets/js/carte.js" />
  <link rel="modulepreload" href="../../assets/js/carte-utils.js" />
  <link rel="modulepreload" href="../../assets/js/marqueurs.js" />
  <link rel="modulepreload" href="../../assets/js/popups.js" />
  <link rel="modulepreload" href="../../assets/js/symboles.js" />
  <link rel="modulepreload" href="../../assets/js/labels.js" />
  <link rel="modulepreload" href="../../assets/js/donnees.js" />
  <link rel="modulepreload" href="../../assets/js/utils.js" />

  <!-- data.geojson (falaises + parkings) ne dépend d'aucun des modules
       ci-dessus : sans cet indice, son fetch() (dans initCarte, carte.js)
       n'aurait démarré qu'une fois tout le graphe JS résolu ET exécuté —
       ici il part en parallèle, dès le parsing HTML. crossorigin (même en
       same-origin) : requis pour que ce préchargement soit réutilisé par le
       fetch() réel de carte.js plutôt que retéléchargé une 2e fois — fetch()
       utilise le mode "cors" par défaut, un preload sans crossorigin ne
       matche pas ce mode et le navigateur traite les deux comme des
       requêtes différentes. -->
  <link rel="preload" href="data.geojson" as="fetch" crossorigin />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.4.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/style-carte.css" />
</head>
<body>

  <header class="map-header">
    <a href="../../index.html">← Sorties</a>
    <span class="titre">Drôme - forêt de Saoû</span>
  </header>

  <div id="panneau-lateral" role="region" aria-label="Recherche et légende de la carte">
    <div class="recherche">
      <div class="recherche-champ">
        <input type="search" list="falaises-liste" placeholder="Chercher une falaise…" aria-label="Rechercher une falaise" />
        <button type="button" class="btn-effacer" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <datalist id="falaises-liste"></datalist>
      <button type="button" class="btn-centrer" aria-label="Centrer la carte sur le résultat">Centrer</button>
    </div>

    <div class="legende">
      <div class="legende-entete">
        <button type="button" class="legende-toggle" aria-expanded="true" aria-controls="legende-contenu" aria-label="Réduire la légende">
          <span class="legende-toggle-texte">Masquer</span>
          <span class="legende-toggle-icone" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="legende-contenu" id="legende-contenu">
        <div class="legende-cats">
          <span id="cle-falaises-zone"><span class="cle"><span class="dot"></span> Falaises</span></span>
          <span class="cle"><span class="dot parking"></span> Parkings <span class="note">(via une falaise)</span></span>
          <span class="cle" id="legende-gite"><span class="dot gite"></span> Gîte</span>
        </div>
        <!-- Le sélecteur est le TITRE des cercles proportionnels : placé au-dessus
             de #legende-falaises (les cercles de référence, ou le message
             "Zoomez pour voir..." quand on est dézoomé). -->
        <div class="legende-figure">
          <select id="mode-figure" aria-label="Grandeur utilisée pour la taille des cercles">
            <option value="aucun">Nombre de voies</option>
            <option value="faciles">Nombre de voies 5-6a+</option>
            <option value="couenne" id="option-couenne">Nombre de couennes</option>
            <option value="gv" id="option-gv">Nombre de grandes voies</option>
          </select>
        </div>
        <div class="legende-falaises" id="legende-falaises"></div>
        <div class="legende-temps" id="legende-temps" hidden>
          <div class="legende-temps-ligne1">
            <label for="filtre-temps">Trajet depuis le gîte</label>
            <span id="filtre-temps-valeur" class="filtre-temps-valeur" aria-live="polite"></span>
          </div>
          <input type="range" id="filtre-temps" aria-describedby="filtre-temps-valeur" />
        </div>
      </div>
    </div>
  </div>

  <!-- Panneau droit (fiche falaise) : sibling de #panneau-lateral, PAS
       imbriqué dedans — il s'ancre à droite de l'écran, indépendant du
       panneau gauche (recherche/légende), qui reste stable pendant que
       celui-ci s'ouvre/se ferme. Voir style-carte.css @media min-width:641px. -->
  <aside id="panneau-falaise" aria-label="Détails de la falaise" inert>
    <div class="panneau-falaise-interieur">
      <button type="button" class="panneau-falaise-fermer" aria-label="Fermer le panneau">×</button>
      <div class="panneau-falaise-contenu"></div>
    </div>
  </aside>

  <div id="map"></div>

  <div id="etat-chargement" class="etat-chargement">Chargement de la carte…</div>

  <!-- Un script type="module" s'exécute déjà après la fin du parsing HTML
       (même garantie que "defer"), donc strictement AVANT que DOMContentLoaded
       ne se déclenche — attendre cet évènement ici n'apportait rien, juste un
       aller-retour de plus dans la boucle d'évènements avant que le fetch de
       data.geojson (voir initCarte, carte.js) ne parte réellement. -->
  <script type="module">
    import { initCarte } from '../../assets/js/carte.js';
    initCarte('data.geojson');
  </script>
  <script>
    // Service worker : enregistré SAUF en dev via Vite (voir index.html racine
    // pour le pourquoi). Ici scope = racine du site (il contrôle aussi
    // l'accueil et les autres sorties).
    if ('serviceWorker' in navigator) {
      const estVite = Array.from(document.querySelectorAll('script[src]'))
        .some((s) => (s.getAttribute('src') || '').includes('/@vite/'));
      if (estVite) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
      } else {
        navigator.serviceWorker.register('../../sw.js', { scope: '../../' });
      }
    }
  </script>
</body>
</html>
