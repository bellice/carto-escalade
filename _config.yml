# Ce que le site publié NE contient PAS.
#
# Sans cette liste, le code des tests, la documentation interne et les fichiers
# de projet répondaient 200 sur tokelau.fr (vérifié, CLAUDE.md compris). Rien de
# confidentiel n'y figure, mais rien n'y a d'usage pour un visiteur non plus.
#
# La liste est lue par outils/construire-site.js, qui prépare le dossier publié
# par GitHub Actions (.github/workflows/pages.yml) : il copie le dépôt sans ces
# entrées et retire les commentaires du JS, du CSS et du HTML. Le format reste
# celui de Jekyll, que Pages applique si le déploiement repasse à la branche.
# Les dossiers cachés (.git, .github, .claude, .vite) ne sont jamais publiés.
#
# NE PAS y ajouter de dossier de lieu (vallee-drome-diois, presquile-crozon…) :
# c'est le site lui-même.
exclude:
  - tests/
  - outils/
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - CLAUDE.md
  - charte-graphique.html
  - redaction.html
  - docs/
