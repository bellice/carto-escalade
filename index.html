<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Voir la page sortie pour le raisonnement complet. Ici la page est
       purement statique : la politique peut être encore plus stricte (aucune
       origine tierce, aucun script inline). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    connect-src 'self';
    base-uri 'none';
    form-action 'none';
    object-src 'none'
  " />
  <title>Sorties escalade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23a8452f'/></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
  <meta name="theme-color" content="#fbfaf6" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="home">
    <h1>Sorties escalade</h1>
    <p class="tagline">falaises · parkings · approches</p>

    <ul class="sortie-list">
      <li>
        <a href="drome-saou/">
          <span class="nom">Drôme - forêt de Saoû</span>
          <span class="date">2026-10</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Externalisé (voir demarrer-accueil.js / sw-client.js) : sans script
       inline, la CSP ci-dessus peut refuser 'unsafe-inline'. -->
  <script type="module" src="assets/js/demarrer-accueil.js"></script>
</body>
</html>
