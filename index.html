<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Voir la page sortie pour le raisonnement complet. Ici la page est
       purement statique : la politique peut être encore plus stricte (aucune
       origine tierce, aucun script inline). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    connect-src 'self';
    base-uri 'none';
    form-action 'none';
    object-src 'none'
  " />
  <title>Tokelau</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23a8452f'/></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
  <meta name="theme-color" content="#fbfaf6" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="home">
    <h1>Tokelau</h1>
    <!-- « hors réseau » en 4e valeur : les trois premiers mots décrivent le
         contenu de la carte, celui-là dit ce qui distingue ce site d'Oblyk ou
         theCrag — le seul terrain où il peut gagner. -->
    <p class="tagline">falaises · parkings · approches · hors&nbsp;réseau</p>

    <ul class="sortie-list">
      <li>
        <a href="vallee-drome-diois/">
          <span class="nom">Vallée de la Drôme et Diois</span>
          <!-- SECTEURS et non falaises : un enregistrement = un couple
               site+secteur, et 37 noms de falaise seulement se partagent les
               111 (Grand Regardé en compte 6 à lui seul). Un libellé posé sur
               un marqueur peut rester approximatif, un COMPTE non.
               Chiffres relevés dans data.geojson, vérifiés par un test
               statique : sans lui, une régénération ferait mentir cette page
               en silence. -->
          <span class="chiffres">21 sites · 111 secteurs · 1 569 voies</span>
          <span class="date">octobre 2026</span>
        </a>
      </li>
    </ul>

    <!-- La phrase la plus utile de la page : elle nomme la seule action qui
         doit avoir lieu AVANT de quitter le wifi. Le bouton correspondant vit
         dans l'en-tête de la carte, donc invisible d'ici.
         Deux affirmations sèches, le fait surprenant d'abord : un jeu de mots
         a sa place sur la 404, moment de friction qu'un clin d'œil adoucit,
         pas ici où l'on vient pour ouvrir une carte. -->
    <p class="note-preparer">En falaise, pas de réseau. Préparez votre carte
      avant de partir.</p>
  </div>

  <!-- Externalisé (voir demarrer-accueil.js / sw-client.js) : sans script
       inline, la CSP ci-dessus peut refuser 'unsafe-inline'. -->
  <script type="module" src="assets/js/demarrer-accueil.js"></script>
</body>
</html>
