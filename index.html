<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Voir la page sortie pour le raisonnement complet. Ici la page est
       purement statique : la politique peut être encore plus stricte (aucune
       origine tierce, aucun script inline). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    connect-src 'self';
    base-uri 'none';
    form-action 'none';
    object-src 'none'
  " />
  <title>Tokelau</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23a8452f'/></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
  <meta name="theme-color" content="#fbfaf6" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="home">
    <!-- La glose n'est pas un ornement : c'est l'étymologie. Sans elle un
         membre du club arrive sur un nom d'île polynésienne posé au-dessus
         d'une carte de la Drôme, et rien sur la page ne l'éclaire. Elle
         touche donc le nom — la souder à la consigne « Préparez votre
         carte » ferait porter le calembour par l'appel à l'action, qui a
         déjà un travail. Et jamais à la forme négative : « ne pas être
         toqué là-haut » ne s'entend plus « toquer là-haut », mais « ne sois
         pas cinglé » — la négation retourne le jeu de mots contre le
         lecteur et fait perdre ce qui le rend drôle. -->
    <h1>Tokelau <span class="glose">toquer là-haut</span></h1>
    <!-- 4e valeur : les trois premiers mots décrivent le contenu de la carte,
         celui-là dit ce qui distingue ce site d'Oblyk ou theCrag — le seul
         terrain où il peut gagner. « hors ligne » et non « hors réseau » :
         c'est le mot que le reste du site emploie déjà (bandeau, bouton,
         hors-ligne.js), et il nomme un MODE de la carte quand « hors réseau »
         nommait une circonstance du terrain — donc une rupture avec les trois
         noms qui précèdent, et une ambiguïté (site non affilié ? falaise
         isolée ?). La note plus bas garde « réseau » pour dire le pourquoi. -->
    <p class="tagline">falaises · parkings · approches · hors&nbsp;ligne</p>

    <!-- Le lieu seul. Les compteurs (« 111 secteurs · 1 569 voies ») et la
         date de sortie ont été retirés : avec un seul lieu dans la liste,
         aucun des deux ne changeait de décision — on cliquait de toute façon.
         La date rouvrait en plus le modèle par SORTIE qu'on avait abandonné
         au profit du modèle par LIEU (un lieu est permanent, une sortie est
         un évènement), et elle serait devenue fausse en novembre sans que
         rien ne le signale.
         Les compteurs reviendront s'ils redeviennent utiles, c'est-à-dire le
         jour où il y aura plusieurs lieux à départager. -->
    <ul class="sortie-list">
      <li>
        <a href="vallee-drome-diois/">
          <span class="nom">Vallée de la Drôme et Diois</span>
        </a>
      </li>
      <li>
        <a href="penhir-argol/">
          <span class="nom">Pen-Hir et Argol</span>
        </a>
      </li>
    </ul>

    <!-- La phrase la plus utile de la page : elle nomme la seule action qui
         doit avoir lieu AVANT de quitter le wifi, et le bouton correspondant
         vit dans l'en-tête de la carte, donc invisible d'ici.
         « Préparez » est le VERBE DU BOUTON : arrivé sur la carte, le lecteur
         reconnaît le mot sur `Préparer` — inutile de lui dire où il est, et
         une phrase qui désigne un bouton d'une autre page prend une voix de
         mode d'emploi.
         « tant que vous avez du réseau » remplace « avant de partir », qui ne
         disait pas avant de partir d'OÙ. C'est la vraie échéance, et elle est
         vraie : la version d'avant ouvrait sur « En falaise, pas de réseau »,
         doublon du « hors ligne » de l'accroche ET surpromesse — beaucoup de
         falaises ont du réseau, et un lecteur qui a cinq barres à Saoû cesse
         de croire le reste de la page. Rien ici sur le pourquoi : l'accroche
         l'a dit trois lignes plus haut. -->
    <p class="note-preparer">Préparez la carte tant que vous avez du réseau.</p>
  </div>

  <!-- Externalisé (voir demarrer-accueil.js / sw-client.js) : sans script
       inline, la CSP ci-dessus peut refuser 'unsafe-inline'. -->
  <script type="module" src="assets/js/demarrer-accueil.js"></script>
</body>
</html>
