  <!-- CSP en <meta> : GitHub Pages n'autorise pas d'en-têtes HTTP.
       MapLibre est servi par le site (assets/vendor/maplibre/) : son worker
       se charge depuis son URL de même origine, sans blob:, donc worker-src
       'self' suffit. PIÈGE : une violation CSP survenue dans un worker ne
       remonte PAS au document ; une directive trop stricte laisse la carte
       vide sans la moindre erreur en console.
       img-src garde blob: : MapLibre décode certaines images PNG par une URL
       blob:.
       Ni script-src ni style-src n'autorisent 'unsafe-inline' : les scripts
       inline sont externalisés, MapLibre écrit ses styles par CSSOM (autorisé)
       et le site n'injecte aucun attribut style="…". Un style="…" ajouté par
       innerHTML serait refusé en silence : poser la taille par
       style.setProperty. frame-ancestors est absent volontairement : cette
       directive est ignorée en <meta>, l'anti-clickjacking reste hors de
       portée sur GitHub Pages. Rationnel complet : README.md. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data: blob: https://tiles.openfreemap.org;
    font-src 'self' data:;
    connect-src 'self' https://tiles.openfreemap.org;
    worker-src 'self';
    child-src 'self';
    base-uri 'none';
    form-action 'none';
    object-src 'none'
  " />

  <!-- crossorigin même en same-origin : fetch() est en mode "cors" par
       défaut, et un preload sans crossorigin ne matche pas ce mode — le
       fichier serait téléchargé deux fois. -->
  <link rel="preload" href="data.geojson" as="fetch" crossorigin />

  <!-- preload et NON stylesheet : une feuille de style bloque le PREMIER
       RENDU jusqu’à la fin de son téléchargement. Mesuré à 200ms de
       latence, avec la feuille servie par un CDN : 388ms contre 84ms sans
       elle — un aller-retour d’écran blanc avant même que « Chargement de
       la carte… » ne s’affiche.
       Le preload lance le téléchargement tout de suite sans rien bloquer ;
       demarrer-sortie.js la promeut en feuille de style juste avant que
       MapLibre ne crée son DOM. URL identique, donc le pré-cache du
       service worker la couvre toujours. -->
  <link rel="preload" as="style" href="../assets/vendor/maplibre/maplibre-gl.css" />

<body>
  <a class="lien-evitement" href="#map">Aller au contenu</a>

  <header class="map-header">
    <a href="../">← Accueil</a>
    <h1 class="titre"><span class="titre-long">Presqu’île de Crozon</span><span class="titre-court">Crozon</span></h1>
    <div id="preparation-hors-ligne"></div>
  </header>

  <div id="panneau-lateral" role="region" aria-label="Recherche et légende de la carte">
    <div class="recherche">
      <div class="recherche-champ">
        <!-- Le champ cherche dans le site, le nom de falaise, le secteur et
             les noms de parking : « Chercher une falaise » en cachait les
             trois quarts. Placeholder court par contrainte de largeur (161px
             utiles) ; l'aria-label, lui, est complet — il n'a pas cette
             contrainte. -->
        <input type="search" list="falaises-liste" placeholder="Site, falaise, secteur…" aria-label="Rechercher un site, une falaise, un secteur ou un parking" />
        <button type="button" class="btn-effacer" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <datalist id="falaises-liste"></datalist>
      <button type="button" class="btn-centrer" aria-label="Voir le résultat de la recherche">Voir</button>
    </div>

    <!-- Pictos + cercles proportionnels : explique les symboles de la carte,
         ne filtre rien. Séparé de .legende (qui, elle, filtre) pour rester
         visible en permanence des deux côtés, desktop ET mobile, quel que
         soit l'état du bouton "Filtres" (desktop) ou le mode Carte/Filtres
         (mobile, voir assets/css/ et panneau-lateral.js). -->
    <div class="legende-cercles" id="legende-cercles">
      <div class="legende-cats">
        <!-- Secteurs et non « Falaises » : un point de la carte est un couple
     site+secteur (111 points pour 37 noms de falaise en Drôme). -->
        <span id="cle-falaises-zone"><span class="cle"><span class="dot"></span> Secteurs</span></span>
        <span class="cle"><span class="dot parking"></span> Parkings</span>
        <span class="cle" id="legende-gite"><span class="dot gite"></span> Gîte</span>
      </div>
      <!-- Titre fixe et non le sélecteur lui-même (déplacé dans le panneau
           "Filtres", voir #legende-contenu plus bas) : les quatre modes
           comptent chacun un sous-ensemble de voies (total, par cotation,
           couennes, grandes voies), "Nombre de voies" reste juste dans les
           quatre cas — inutile de le faire varier avec le mode actif. Sa
           place au-dessus de #legende-falaises reste voulue : il titre les
           cercles proportionnels rendus juste en dessous. -->
      <div class="legende-figure">
        <span class="legende-figure-titre">Nombre de voies</span>
        <!-- Indépendant du mode "Cercles" (voir Filtres) : un filtre
             couenne/gv/cotation actif le reste, épurer ne fait qu'uniformiser
             la taille affichée. -->
        <button type="button" class="btn-epuree" aria-pressed="false" aria-label="Simplifier l'affichage des cercles">Épurer</button>
      </div>
      <div class="legende-falaises" id="legende-falaises"></div>
    </div>

    <div class="legende">
      <!-- Replie seulement CE bloc (#legende-contenu), jamais .legende-cercles
           juste au-dessus (pictos + cercles proportionnels, qui explique la
           carte plutôt qu'il ne filtre — reste affiché en permanence, voir
           son propre commentaire). Placé ici, juste avant ce qu'il replie,
           plutôt qu'en tête de tout le panneau : le libellé "Filtres" dit
           déjà sa portée, nul besoin de le mettre à distance des pictos qu'il
           ne touche pas. Masqué sur mobile (voir assets/css/) : la
           bascule Carte/Filtres y joue déjà ce rôle. -->
      <div class="legende-entete">
        <button type="button" class="legende-toggle" aria-expanded="true" aria-controls="legende-contenu" aria-label="Réduire les filtres">
          <!-- Compte les filtres actifs ("Filtres · 2"), tenu à jour par
               rafraichirBoutonReinitialiserFiltres (filtres.js) — même
               convention que le bouton "Filtres" de la bascule mobile. Le
               chevron seul dit replié/déplié (rotation CSS sur
               aria-expanded, voir .legende-toggle-icone) : le texte ne
               porte plus "Masquer"/"Afficher". -->
          <span class="legende-toggle-texte">Filtres</span>
          <span class="legende-toggle-icone" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="legende-contenu" id="legende-contenu">
        <!-- Visible seulement dans le panneau "Filtres" plein écran mobile
             (voir assets/css/) : falaisesVisibles est déjà tenue à jour
             par appliquerFiltres, aucun nouveau calcul (visibilite.js). -->
        <p class="legende-resultat" id="legende-resultat" aria-live="polite"></p>
        <!-- Deux questions distinctes : le type de voie compté par la taille des
             cercles (.legende-figure dans .legende-cercles, toujours visible
             côté Carte, en montre le titre fixe et le résultat), et la cotation
             à laquelle on s'intéresse. Vivent ici et non côté Carte : question
             de réglage, pas de lecture de la carte.
             Choix unique en pastilles (boutons radio), comme Pratique : "Tous"
             par défaut, sinon Couenne ou Grande voie, qui restreint aux
             secteurs qui en ont et donne aux cercles la taille et la couleur
             de ce type. Se combine avec "Cotation des voies" juste en dessous,
             un filtre indépendant (voir appliquerFiltreCotation, filtres.js). -->
        <div class="legende-ensoleillement" id="legende-type-voie" role="radiogroup" aria-label="Filtrer par type de voie">
          <span class="legende-ensoleillement-label">Type de voie</span>
          <label class="case-ensoleillement"><input type="radio" name="type-voie" data-type-voie="aucun" checked />Tous</label>
          <label class="case-ensoleillement"><input type="radio" name="type-voie" data-type-voie="couenne" />Couenne</label>
          <label class="case-ensoleillement"><input type="radio" name="type-voie" data-type-voie="gv" />Grande voie</label>
        </div>
        <!-- Filtre "Style d’escalade" (configurerFiltreStyle, filtres.js) : choix unique en
             pastilles (boutons radio), "Tous" par défaut, mêmes classes que
             Ensoleillement (aucun CSS propre). Donne sa taille aux cercles,
             comme Type de voie. Masqué tant que la sortie compte moins de deux
             pratiques. La moulinette reste hors filtre. -->
        <div class="legende-ensoleillement" id="legende-style" hidden role="radiogroup" aria-label="Filtrer par style d’escalade">
          <span class="legende-ensoleillement-label">Style d’escalade</span>
          <label class="case-ensoleillement"><input type="radio" name="pratique" data-style="tous" checked />Tous</label>
          <label class="case-ensoleillement"><input type="radio" name="pratique" data-style="sportive" />Sportive</label>
          <label class="case-ensoleillement"><input type="radio" name="pratique" data-style="trad" />Trad</label>
          <label class="case-ensoleillement"><input type="radio" name="pratique" data-style="artificielle" />Artif</label>
        </div>
        <!-- Toujours visible (pas de hidden) : au repos, les bornes couvrent
             toute l'échelle présente dans cette sortie, ce qui dit "inactif"
             aussi clairement qu'un repli — même principe que le curseur
             "Depuis le gîte" au plafond. -->
        <div class="legende-cotation" id="legende-cotation">
          <span class="legende-figure-label">Cotation des voies</span>
          <div class="legende-cotation-bornes">
            <label for="cotation-min">De</label>
            <select id="cotation-min"></select>
            <label for="cotation-max">à</label>
            <select id="cotation-max"></select>
          </div>
        </div>
        <!-- Filtre indépendant du mode "Type de voie", au même titre que la
             fourchette de cotation : il n'agit ni sur la taille ni sur la
             couleur des cercles, seulement sur qui reste affiché.
             Cases à cocher, pas des boutons-bascule façon .btn-tri-voies/
             .btn-epuree : ceux-ci signifient déjà "un seul choix à la fois"
             ailleurs sur ce site (tri Cotation/Position, vue Épurée) — les
             réutiliser ici aurait suggéré la même règle à tort, alors que
             PLUSIEURS catégories sont cochables à la fois (voir
             configurerFiltreEnsoleillement, filtres.js). Une case à cocher le
             dit sans un mot d'explication.
             Deux groupes : Matin/Journée/Après-midi se cochent ensemble EN
             OU, chacune une correspondance EXACTE — pas de règle qui
             devinerait qu'on veut aussi "Journée" en cochant Matin+Après-
             midi (essayé, retiré, voir le commentaire de
             filtres.ensoleillement dans etat.js) : "au moins ce moment-là,
             peu importe le reste" et "CE moment précis, pas plus" sont deux
             besoins réels et opposés, cocher Journée EN PLUS explicitement
             est la seule façon de dire lequel des deux on veut. "Non" reste
             mutuellement exclusif avec les trois autres — chercher le
             soleil et chercher son absence sont deux intentions opposées,
             pas des nuances à combiner. Placé avant "Depuis le gîte" :
             pertinent pour tout le monde, contrairement au trajet depuis un
             hébergement qu'on n'a pas forcément. -->
        <div class="legende-ensoleillement" id="legende-ensoleillement" hidden role="group" aria-label="Filtrer par ensoleillement">
          <span class="legende-ensoleillement-label">Ensoleillement</span>
          <label class="case-ensoleillement"><input type="checkbox" data-ensoleillement="matin" />Le matin</label>
          <label class="case-ensoleillement"><input type="checkbox" data-ensoleillement="journee" />Toute la journée</label>
          <label class="case-ensoleillement"><input type="checkbox" data-ensoleillement="apres-midi" />L’après-midi</label>
          <label class="case-ensoleillement"><input type="checkbox" data-ensoleillement="nord" />Aucun</label>
        </div>
        <div class="legende-temps" id="legende-temps" hidden>
          <div class="legende-temps-ligne1">
            <label for="filtre-temps">Trajet depuis le gîte</label>
            <span id="filtre-temps-valeur" class="filtre-temps-valeur" aria-live="polite"></span>
          </div>
          <input type="range" id="filtre-temps" aria-describedby="filtre-temps-valeur" />
        </div>
        <!-- Efface d'un coup les quatre filtres qui masquent des falaises —
             Type de voie, Cotation des voies, Ensoleillement, Depuis le gîte
             (voir configurerReinitialisationFiltres, filtres.js). Placé après
             eux, pas avant : sa portée se lit par adjacence, pas par un
             titre. Affiché en permanence (carte.js le montre au chargement),
             seulement grisé tant que rien n'est actif : pas de saut du DOM à
             la première sélection. -->
        <button type="button" class="btn-reinitialiser-filtres" id="reinitialiser-filtres" hidden disabled>Réinitialiser</button>
      </div>
    </div>
  </div>

  <!-- Bascule mobile plein écran Carte/Filtres : sous 641px, remplace la
       légende flottante par un aller-retour explicite entre la carte et un
       panneau plein écran (voir assets/css/ @media max-width:640px et
       panneau-lateral.js, definirVueMobile). Ancrée là où vivait .legende-toggle (bas
       gauche) : jamais de chevauchement avec l'attribution OpenStreetMap
       (bas droite, voir le commentaire de .bandeau-hors-ligne sur ce même
       risque) ni avec l'indicateur hors-ligne (haut gauche). Invisible
       ≥641px (desktop inchangé), sibling de #panneau-lateral et non imbriqué
       dedans : elle ne doit pas défiler avec son contenu en mode Filtres. -->
  <div class="bascule-vue" role="group" aria-label="Vue de la carte">
    <button type="button" class="btn-vue" id="btn-vue-carte" aria-pressed="true">Carte</button>
    <button type="button" class="btn-vue" id="btn-vue-filtres" aria-pressed="false">Filtres</button>
  </div>

  <!-- Sibling de #panneau-lateral, PAS imbriqué dedans : il s'ancre à droite,
       indépendamment du panneau gauche, qui doit rester stable quand celui-ci
       s'ouvre. Voir assets/css/ @media (min-width: 641px). -->
  <aside id="panneau-falaise" aria-label="Détails de la falaise" inert>
    <div class="panneau-falaise-interieur">
      <button type="button" class="panneau-falaise-fermer" aria-label="Fermer le panneau">×</button>
      <div class="panneau-falaise-contenu"></div>
    </div>
  </aside>

  <main id="map" data-donnees="data.geojson" aria-label="Carte des falaises">
    <noscript>
