# Déploiement GitHub Pages : tests statiques, construction de _site/ (commentaires
# retirés, voir outils/construire-site.js), publication.
#
# Réglage à faire une fois : Paramètres du dépôt, Pages, Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests statiques
        run: node --test tests/statique.test.js
      - name: Construire le site
        run: node outils/construire-site.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
